name: Auto Process TNEA Data

on:
  push:
    paths:
    - 'data_processing/**'
  workflow_dispatch:  # <-- This adds the manual "Run" button

jobs:
  process-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run data processing script
        run: python data_processing/process_data.py

      - name: Commit and Push Data Chunks
        run: |
          git config --global user.name "actions-user"
          git config --global user.email "actions@github.co"
          git add public/*.json
          git commit -m "Auto-update data chunks via workflow_dispatch" || echo "No changes to commit"
          git push

